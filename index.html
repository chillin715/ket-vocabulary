<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KET 词汇册 · A2 Key Vocabulary Book</title>
<style>
:root{
  --coral:#ff6b6b;--orange:#ffa94d;--teal:#20c997;--blue:#4dabf7;--purple:#9775fa;
  --pink:#f783ac;--ink:#2b2d42;--sub:#6c757d;--line:#eef0f4;--bg:#f6f8fc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- Cover ---------- */
.cover{min-height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;
  justify-content:center;text-align:center;color:#fff;
  background:linear-gradient(135deg,#ff6b6b 0%,#ffa94d 28%,#9775fa 68%,#4dabf7 100%)}
.cover .blob{position:absolute;border-radius:50%;opacity:.3;background:#fff}
.cover .b1{width:340px;height:340px;top:-120px;left:-90px}
.cover .b2{width:260px;height:260px;bottom:-80px;right:-60px;opacity:.25}
.cover .b3{width:140px;height:140px;top:18%;right:12%}
.cover .float{position:absolute;font-size:2.3rem;animation:bob 4s ease-in-out infinite}
.cover .f1{top:14%;left:13%}.cover .f2{top:72%;left:9%;animation-delay:.8s}
.cover .f3{top:20%;right:15%;animation-delay:1.6s}.cover .f4{bottom:13%;right:19%;animation-delay:2.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.cover-inner{position:relative;z-index:2;padding:28px 22px;width:min(560px,94vw)}
.cover .badge{display:inline-block;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.55);
  padding:7px 18px;border-radius:999px;font-size:.85rem;letter-spacing:2px;margin-bottom:22px}
.cover h1{font-size:clamp(3rem,11vw,5.4rem);font-weight:900;letter-spacing:6px;line-height:1.05;
  text-shadow:0 8px 24px rgba(0,0,0,.18)}
.cover h2{font-size:clamp(1rem,3vw,1.4rem);font-weight:500;margin-top:14px;letter-spacing:3px;opacity:.95}
.name-box{margin:30px auto 22px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);
  border-radius:18px;padding:18px 20px;backdrop-filter:blur(6px);text-align:left}
.name-box label{font-size:.9rem;opacity:.95;display:block;margin-bottom:10px;letter-spacing:1px}
.name-row{display:flex;gap:10px}
.name-box input{flex:1;border:none;border-radius:12px;padding:13px 16px;font-size:1.05rem;outline:none;color:var(--ink)}
.name-box button{border:none;background:#fff;color:var(--purple);font-weight:800;border-radius:12px;padding:0 20px;cursor:pointer}
.hello{display:none;margin-top:14px;font-size:1.05rem;line-height:1.6}
.hello b{font-size:1.2rem}
.cover .progress{height:10px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:10px;overflow:hidden}
.cover .progress i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s}
.cover .stats{display:flex;gap:12px;justify-content:center;margin:18px 0 26px;flex-wrap:wrap}
.cover .stat{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);
  border-radius:16px;padding:10px 18px;min-width:96px}
.cover .stat b{display:block;font-size:1.5rem;font-weight:800}
.cover .stat span{font-size:.8rem;opacity:.9}
.cover .start{display:inline-block;background:#fff;color:#ff6b6b;font-weight:800;font-size:1.1rem;
  border:none;border-radius:999px;padding:15px 42px;cursor:pointer;letter-spacing:2px;
  box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .2s}
.cover .start:hover{transform:translateY(-3px)}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:11px 16px;box-shadow:0 2px 14px rgba(0,0,0,.05)}
.toolbar-row{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:900;font-size:1.08rem;background:linear-gradient(90deg,var(--coral),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.search{flex:1;min-width:170px;display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);
  border-radius:999px;padding:8px 16px;gap:7px}
.search input{border:none;background:none;outline:none;flex:1;font-size:.96rem}
.tbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:.88rem;
  cursor:pointer;color:var(--sub);font-weight:600;white-space:nowrap}
.tbtn.on{background:linear-gradient(90deg,var(--coral),var(--orange));color:#fff}
.letters{max-width:1200px;margin:7px auto 0;display:flex;gap:3px;flex-wrap:wrap}
.letters a{font-size:.82rem;font-weight:700;color:var(--sub);text-decoration:none;padding:3px 8px;border-radius:8px}
.letters a:hover{background:var(--purple);color:#fff}

/* ---------- List ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 30px}
.sec-letter{font-size:1.5rem;font-weight:900;margin:24px 4px 12px;color:#fff;display:inline-block;
  width:42px;height:42px;line-height:42px;text-align:center;border-radius:12px;
  background:linear-gradient(135deg,var(--coral),var(--orange))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 15px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:box-shadow .15s,transform .15s;position:relative}
.card:hover{box-shadow:0 10px 26px rgba(43,45,66,.1);transform:translateY(-2px)}
.card.star{border-left:4px solid var(--orange);background:linear-gradient(180deg,#fffaf3,#fff)}
.card.learned{border-left:4px solid var(--teal)}
.c-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-emoji{font-size:1.5rem}
.c-word{font-size:1.18rem;font-weight:800}
.c-star{color:var(--orange);font-weight:900}
.c-done{color:var(--teal);font-weight:900;font-size:1rem}
.c-finger{margin-left:auto;font-size:1.05rem;opacity:.8;animation:poke 1.6s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
.speak{border:none;cursor:pointer;background:linear-gradient(135deg,#4dabf7,#9775fa);color:#fff;
  width:30px;height:30px;border-radius:50%;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center}
.speak:hover{transform:scale(1.12)}
.pos{font-size:.7rem;font-weight:700;color:var(--purple);background:#f1edff;border-radius:6px;padding:2px 8px}
.c-cn{font-size:.98rem;line-height:1.45}
.c-syn{font-size:.82rem;color:var(--sub);line-height:1.5}
.c-syn b{color:var(--blue)}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:1.05rem}
.hidden{display:none!important}
.finish-bar{max-width:1200px;margin:26px auto 0;padding:0 16px;text-align:center}
.finish-btn{border:none;cursor:pointer;font-size:1.12rem;font-weight:800;color:#fff;letter-spacing:2px;
  border-radius:999px;padding:17px 48px;
  background:linear-gradient(90deg,#20c997,#4dabf7);box-shadow:0 12px 30px rgba(32,201,151,.35)}
.finish-btn:hover{transform:translateY(-3px)}

/* ---------- Detail ---------- */
.detail{max-width:760px;margin:0 auto;padding:18px 18px 70px}
.dback{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-weight:700;
  color:var(--sub);cursor:pointer;font-size:.9rem}
.dback:hover{color:var(--purple);border-color:var(--purple)}
.d-hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 24px 30px;margin-top:16px;
  text-align:center;box-shadow:0 12px 34px rgba(43,45,66,.07)}
.d-img{width:150px;height:150px;margin:0 auto 18px;border-radius:28px;display:flex;align-items:center;
  justify-content:center;font-size:5.2rem;background:linear-gradient(135deg,#e7f0ff,#f3edff)}
.d-img.no-emoji{font-size:3.6rem;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--coral),var(--purple))}
.d-word{font-size:clamp(2.2rem,8vw,3.2rem);font-weight:900;letter-spacing:1px;word-break:break-word}
.d-speak{border:none;cursor:pointer;background:linear-gradient(135deg,#4dabf7,#9775fa);color:#fff;
  width:46px;height:46px;border-radius:50%;font-size:1.3rem;vertical-align:middle;margin-left:10px}
.d-pos{margin-top:14px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.d-pos span{font-size:.8rem;font-weight:700;color:var(--purple);background:#f1edff;border-radius:8px;padding:4px 12px}
.d-learn{margin-top:22px;border:2px solid var(--teal);background:#fff;color:var(--teal);font-weight:800;
  border-radius:999px;padding:12px 30px;font-size:1rem;cursor:pointer;transition:all .15s}
.d-learn:hover{background:#e8fbf5}
.d-learn.on{background:linear-gradient(135deg,var(--teal),#12b886);color:#fff;border-color:transparent}
.d-sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:14px}
.d-sec h3{font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.d-sec p,.d-sec li{font-size:.96rem;line-height:1.75;list-style:none}
.d-sec .cn-main{font-size:1.15rem;font-weight:700;line-height:1.6}
.d-root{background:#e8fbf5;color:#0ca678;border-radius:10px;padding:9px 14px;font-size:.9rem;margin-top:8px;line-height:1.6}
.d-synline{font-size:.92rem;margin-top:10px;line-height:1.7}
.d-synline .chip{display:inline-block;background:#f1f7ff;border:1px solid #dbe9ff;border-radius:9px;
  padding:3px 10px;margin:3px 4px 0 0}
.d-synline .chip b{color:var(--blue)}
.d-synline .chip i{font-style:normal;color:var(--purple);font-weight:700;font-size:.82rem}
.d-synline .chip span{color:var(--sub);font-size:.85rem}
.exam-item{background:#fafbff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.exam-item .src{font-size:.95rem;line-height:1.65}
.exam-item mark{background:#fff3bf;border-radius:5px;padding:0 4px;font-weight:700}
.exam-item .ana{margin-top:8px;font-size:.88rem;color:var(--sub);line-height:1.6}
.exam-item .ana b{color:var(--coral)}
.d-tip{background:#fff9db;border-radius:10px;padding:10px 14px;font-size:.92rem;line-height:1.65;margin-top:10px}
.generic{color:var(--sub);font-size:.9rem;line-height:1.7}
.d-ipa{margin-top:10px;font-size:1.18rem;color:var(--blue);font-weight:700;letter-spacing:.5px}
.posdefs{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.pdef{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:#f8f6ff}
.pdef .ptag{flex-shrink:0;min-width:46px;font-style:italic;font-weight:800;color:var(--purple);font-size:1.02rem}
.pdef .pmean{font-size:1.02rem;line-height:1.6}
.pdef .pmean .ex{display:block;color:var(--sub);font-size:.88rem;margin-top:3px}
.dforms{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:4px}
.dform{font-size:.95rem;line-height:1.5}
.dform b{color:var(--sub);font-weight:700;margin-right:5px}
.dform .fw{color:var(--blue);font-weight:800}
.dform .tag{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;background:var(--coral);
  border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.dform .tag.sp{background:var(--orange)}
.dform .tag.rule{background:var(--teal)}

/* ---------- Modal + confetti ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(30,32,48,.55);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:24px;width:min(420px,92vw);padding:32px 26px 28px;text-align:center;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal .big{font-size:3.4rem}
.modal h3{font-size:1.4rem;margin:8px 0 4px}
.modal .nums{display:flex;gap:12px;margin:18px 0 22px}
.modal .nbox{flex:1;background:linear-gradient(135deg,#e7f0ff,#f1edff);border-radius:16px;padding:14px 6px}
.modal .nbox b{display:block;font-size:1.9rem;color:var(--purple)}
.modal .nbox span{font-size:.82rem;color:var(--sub)}
.modal button{border:none;border-radius:999px;padding:12px 34px;font-size:1rem;font-weight:800;color:#fff;
  cursor:pointer;background:linear-gradient(90deg,var(--coral),var(--orange))}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

@media print{
  @page{size:A4;margin:11mm 10mm}
  body{background:#fff}
  .cover{min-height:auto;height:100vh;page-break-after:always}
  .cover .start,.name-box button{display:none}
  .toolbar{position:static;display:none}
  .wrap{padding:0;max-width:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card{box-shadow:none;padding:10px 12px}
  .speak,.d-speak,.c-finger,.finish-bar{display:none}
  .dback{display:none}
}
</style>
</head>

<section class="cover" id="cover">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="float f1">📚</div><div class="float f2">✏️</div><div class="float f3">🎧</div><div class="float f4">🌟</div>
  <div class="cover-inner">
    <div class="badge">CAMBRIDGE A2 KEY · KEY FOR SCHOOLS</div>
    <h1>KET 词汇册</h1>
    <h2>A2 Key Vocabulary Book</h2>
    <div class="name-box">
      <label>👋 先输入你的名字，开始专属学习（中英文均可）</label>
      <div class="name-row">
        <input id="nameInput" type="text" maxlength="16" placeholder="你的名字…">
        <button onclick="saveName()">确定</button>
      </div>
      <div class="hello" id="helloBox"></div>
    </div>
    <div class="stats">
      <div class="stat"><b>1889</b><span>词汇总量</span></div>
      <div class="stat"><b id="stLearned">0</b><span>已学会</span></div>
      <div class="stat"><b>223</b><span>真题补充</span></div>
    </div>
    <button class="start" onclick="goBook()">开始学习 →</button>
  </div>
</section>

<div class="toolbar hidden" id="toolbar">
  <div class="toolbar-row">
    <div class="brand" id="brandName">KET 词汇册</div>
    <div class="search">🔍<input id="q" type="text" placeholder="搜索单词 / 中文…" oninput="renderList()"></div>
    <button class="tbtn on" id="bAll" onclick="setFilter('all')">全部</button>
    <button class="tbtn" id="bStar" onclick="setFilter('star')">★补充</button>
    <button class="tbtn" id="bDone" onclick="setFilter('done')">✓已学会</button>
  </div>
  <div class="letters" id="letters"></div>
</div>

<div class="wrap hidden" id="listView">
  <div id="content"></div>
  <div class="empty hidden" id="emptyTip">没有找到匹配的单词 🐾</div>
  <div class="finish-bar"><button class="finish-btn" onclick="finishToday()">🎉 完成今日单词</button></div>
</div>

<div class="detail hidden" id="detailView"></div>

  // high-quality neural/cloud voices first, then named natural female voices
  const neural=['Google US English','Microsoft Jenny Online','Microsoft Aria Online','Samantha',
    'Microsoft Jenny','Microsoft Aria','Microsoft Zira','Joanna','Salli','Kendra','Google US',
    'Female','Karen','Moira','Tessa'];
  for(const n of neural){const x=us.find(v=>v.name.includes(n))||en.find(v=>v.name.includes(n));if(x){voice=x;return}}
  const cloud=us.find(v=>v.localService===false)||en.find(v=>v.localService===false);
  voice=cloud||us[0]||en[0]||null;
}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
function speak(ev,w){if(ev)ev.stopPropagation();speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w);u.lang='en-US';if(voice)u.voice=voice;
  u.rate=.82;u.pitch=1.0;u.volume=1;
  speechSynthesis.speak(u)}

/* ---- cover ---- */
function saveName(){
  const v=document.getElementById('nameInput').value.trim();
  if(v){store.name=v}
  refreshHello();
}
function refreshHello(){
  const n=store.name;
  document.getElementById('nameInput').value=n;
  const box=document.getElementById('helloBox');
  const cnt=Object.keys(store.myMap()).length;
  document.getElementById('stLearned').textContent=cnt;
  if(n){box.style.display='block';
    box.innerHTML=`嗨 <b>${esc(n)}</b>，欢迎回来！你已经学会 <b>${cnt}</b> 个单词，继续加油 🌟
    <div class="progress"><i style="width:${(cnt/DATA.length*100).toFixed(1)}%"></i></div>`}
  else box.style.display='none';
}
function goBook(){
  if(!store.name){const v=document.getElementById('nameInput').value.trim();if(v)store.name=v}
  if(!store.name){document.getElementById('nameInput').focus();return}
  location.hash='#/list';
}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveName()});
refreshHello();

/* ---- routing ---- */
const POS_CN={n:'名词',v:'动词',adj:'形容词',adv:'副词',prep:'介词',conj:'连词',pron:'代词',
  det:'限定词',exclam:'感叹词',num:'数词',ord:'序数词',phr:'短语',modal:'情态动词',mv:'情态动词',
  prefix:'前缀',suffix:'后缀',art:'冠词'};
function posCn(p){return p.split(/[&,;\/]/).map(s=>POS_CN[s.trim()]||s.trim()).join(' · ')}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function route(){
  const h=location.hash;
  const m=h.match(/^#\/word\/(.+)$/);
  if(m){showDetail(decodeURIComponent(m[1]))}
  else if(h==='#/list'){showList()}
  else{showCover()}
}
function showCover(){
  document.getElementById('cover').classList.remove('hidden');
  document.getElementById('toolbar').classList.add('hidden');
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('hidden');
  refreshHello();window.scrollTo(0,0);
}
function showList(){
  if(!store.name){showCover();return}
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('toolbar').classList.remove('hidden');
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('brandName').textContent=store.name+' 的词汇册';
  renderList();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---- synonym annotation ---- */
function synInfo(token){
  const t=token.toLowerCase();
  if(BYW[t]){const r=BYW[t];return {pos:r.pos?posCn(r.pos):'',cn:r.cn}}
  if(SYNINFO[t])return {pos:SYNINFO[t].pos?posCn(SYNINFO[t].pos):'',cn:SYNINFO[t].cn};
  return null;
}
function synChips(synStr){
  const toks=synStr.split(';').map(s=>s.trim()).filter(Boolean);
  return toks.map(t=>{
    const info=synInfo(t);
    return `<span class="chip"><b>${esc(t)}</b>${info?` <i>${esc(info.pos)}</i> <span>${esc(info.cn)}</span>`:''}</span>`;
  }).join('');
}

/* ---- list ---- */
function setFilter(f){filter=f;
  ['bAll','bStar','bDone'].forEach(id=>document.getElementById(id).classList.remove('on'));
  document.getElementById({all:'bAll',star:'bStar',done:'bDone'}[f]).classList.add('on');renderList()}
function renderList(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const groups={};
  for(const r of DATA){
    if(filter==='star'&&!r.star)continue;
    if(filter==='done'&&!isLearned(r.w))continue;
    if(q&&!(r.w.toLowerCase().includes(q)||r.cn.toLowerCase().includes(q)))continue;
    (groups[r.w[0].toUpperCase()]||=[]).push(r);
  }
  let out='';
  for(const L of Object.keys(groups).sort()){
    out+=`<div class="sec-letter">${L}</div><div class="grid">`;
    for(const r of groups[L]){
      const done=isLearned(r.w);
      out+=`<div class="card${r.star?' star':''}${done?' learned':''}" onclick="openWord('${encodeURIComponent(r.w)}')">
        <div class="c-top">
          ${r.emoji?`<span class="c-emoji">${r.emoji}</span>`:''}
          ${r.star?`<span class="c-star">★</span>`:''}
          ${done?`<span class="c-done">✓</span>`:''}
          <span class="c-word">${esc(r.w)}</span>
          <button class="speak" onclick="speak(event,'${esc(r.w).replace(/'/g,"\\'")}')">🔊</button>
          ${r.pos?`<span class="pos">${esc(r.pos)}</span>`:''}
          <span class="c-finger">👆</span>
        </div>
        <div class="c-cn">${esc(r.cn)}</div>
        ${r.syn?`<div class="c-syn"><b>相似词 ▸</b> ${synChips(r.syn)}</div>`:''}
      </div>`;
    }
    out+='</div>';
  }
  document.getElementById('content').innerHTML=out;
  document.getElementById('emptyTip').classList.toggle('hidden',Object.keys(groups).length>0);
  const allL=[...new Set(DATA.map(r=>r.w[0].toUpperCase()))].sort();
  document.getElementById('letters').innerHTML=allL.map(L=>`<a href="javascript:void(0)"
    onclick="jumpLetter('${L}')">${L}</a>`).join('');
}
function jumpLetter(L){const el=[...document.querySelectorAll('.sec-letter')].find(e=>e.textContent===L);if(el)el.scrollIntoView()}
function openWord(w){location.hash='#/word/'+w}

/* ---- detail ---- */
function highlight(sent,w){
  const base=w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('\\b('+base+'[a-z]*)\\b','i');
  return esc(sent).replace(re,m=>`<mark>${m}</mark>`);
}
/* ---- per-POS definition blocks ---- */
function defBlocks(r){
  const parts=[];
  if(r.detail){
    // split curated ①②③ items
    const items=r.detail.split(/[①②③④⑤]/).map(s=>s.trim()).filter(Boolean);
    for(const it of items){
      const m=it.match(/^([a-z]+)\.\s*(.+)$/);
      if(m){parts.push(`<div class="pdef"><span class="ptag">${esc(m[1])}.</span>
        <span class="pmean">${esc(m[2])}</span></div>`)}
      else{parts.push(`<div class="pdef"><span class="ptag">·</span><span class="pmean">${esc(it)}</span></div>`)}
    }
  }
  if(!parts.length){
    const poss=(r.pos||'').split(/[\/,;]/).map(s=>s.trim()).filter(Boolean);
    const cns=r.cn.split(/[；;]/).map(s=>s.trim()).filter(Boolean);
    if(poss.length>1&&poss.length===cns.length){
      poss.forEach((p,i)=>parts.push(`<div class="pdef"><span class="ptag">${esc(p)}.</span>
        <span class="pmean">${esc(cns[i])}</span></div>`));
    }else{
      parts.push(`<div class="pdef"><span class="ptag">${esc(poss[0]||'·')}</span>
        <span class="pmean cn-main">${esc(r.cn)}</span></div>`);
    }
  }
  return `<div class="posdefs">${parts.join('')}</div>`;
}

/* ---- word forms block ---- */
function formsBlock(r){
  const f=FORMS[r.w];
  if(!f)return '';
  const items=[];
  if(f.pl)items.push(`<span class="dform"><b>复数：</b><span class="fw">${esc(f.pl)}</span>
    ${f.pl_irr?`<span class="tag rule">特殊变化</span>`:''}</span>`);
  if(f.s3)items.push(`<span class="dform"><b>第三人称单数：</b><span class="fw">${esc(f.s3)}</span>
    ${f.v_irr&&f.s3!==r.w+'s'?`<span class="tag sp">特殊三单</span>`:''}</span>`);
  if(f.past)items.push(`<span class="dform"><b>过去式：</b><span class="fw">${esc(f.past)}</span>
    ${f.v_irr?`<span class="tag ${f.pp&&f.past!==f.pp?'':'sp'}">${f.pp&&f.past!==f.pp?'不规则':'特殊过去式'}</span>`:''}</span>`);
  if(f.pp&&f.pp!==f.past)items.push(`<span class="dform"><b>过去分词：</b><span class="fw">${esc(f.pp)}</span>
    <span class="tag">不规则</span></span>`);
  if(f.ing)items.push(`<span class="dform"><b>-ing 形式：</b><span class="fw">${esc(f.ing)}</span>
    ${f.v_irr&&f.ing!==r.w+'ing'?`<span class="tag rule">特殊 -ing</span>`:''}</span>`);
  return `<div class="d-sec"><h3>🔤 词形变化</h3><div class="dforms">${items.join('')}</div></div>`;
}

function showDetail(w){
  const r=BYW[w];
  if(!r){location.hash='#/list';return}
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('toolbar').classList.add('hidden');
  document.getElementById('listView').classList.add('hidden');
  const dv=document.getElementById('detailView');dv.classList.remove('hidden');
  const done=isLearned(w);
  const detailSec = defBlocks(r);
  let examHtml;
  if(r.ex&&r.ex.length){
    examHtml=r.ex.map(s=>`<div class="exam-item">
      <div class="src">📄 “${highlight(s,w)}”</div>
      <div class="ana">解析：句中 <b>${esc(w)}</b> 为${r.pos?esc(posCn(r.pos)):''}，意思是「${esc(r.cn.split('；')[0])}」，结合上下文理解词义。</div>
    </div>`).join('');
  } else {
    examHtml=`<p class="generic">该词为 KET 核心词，真题中常以变形（单复数、时态、-ing 等）出现，
    注意在听力图片题、阅读完形和口语问答中结合语境识别。</p>`;
  }
  dv.innerHTML=`
    <button class="dback" onclick="location.hash='#/list'">← 返回词表</button>
    <div class="d-hero">
      <div class="d-img ${r.emoji?'':'no-emoji'}">${r.emoji||r.w[0].toUpperCase()}</div>
      <span class="d-word">${esc(r.w)}</span>
      <button class="d-speak" onclick="speak(event,'${esc(r.w).replace(/'/g,"\\'")}')">🔊</button>
      <div class="d-ipa">${IPA[r.w]||''}</div>
      <div class="d-pos">${r.pos?`<span>${esc(posCn(r.pos))}</span>`:''}
        ${r.star?`<span style="background:#fff4e6;color:#e8590c">★ 真题补充词</span>`:''}
        ${done?`<span style="background:#e8fbf5;color:#0ca678">✓ 已学会</span>`:''}</div>
      <button class="d-learn ${done?'on':''}" onclick="doLearn()">
        ${done?'✓ 已学会（点击取消）':'☆ 标记为已学会'}</button>
    </div>
    <div class="d-sec"><h3>📖 详细解释</h3>${detailSec}
      ${r.root?`<div class="d-root">🧩 词根拆解：${esc(r.root)}</div>`:''}
      ${r.examtip?`<div class="d-tip">💡 学习提示：${esc(r.examtip)}</div>`:''}
      ${r.syn?`<div class="d-synline"><b>相似词（含词性与释义）</b><br>${synChips(r.syn)}</div>`:''}
    </div>
    <div class="d-sec"><h3>📝 真题原句与解析</h3>${examHtml}</div>
    ${formsBlock(r)}`;
  window.scrollTo(0,0);
}
function doLearn(){
  const m=location.hash.match(/^#\/word\/(.+)$/);if(!m)return;
  const w=decodeURIComponent(m[1]);toggleLearned(w);showDetail(w);
}

/* ---- finish modal + confetti ---- */
function finishToday(){
  const t=todayCount(),all=Object.keys(store.myMap()).length;
  const mask=document.createElement('div');mask.className='modal-mask';mask.id='finishMask';
  mask.innerHTML=`<div class="modal">
    <div class="big">🏆</div>
    <h3>今日学习完成！</h3>
    <p style="color:var(--sub);font-size:.92rem">${esc(store.name)}，你今天真棒</p>
    <div class="nums">
      <div class="nbox"><b>${t}</b><span>今日新学会</span></div>
      <div class="nbox"><b>${all}</b><span>累计已学会</span></div>
    </div>
    <button onclick="closeFinish()">继续加油 →</button>
  </div>`;
  mask.addEventListener('click',e=>{if(e.target===mask)closeFinish()});
  document.body.appendChild(mask);
  launchConfetti();
}
function closeFinish(){const m=document.getElementById('finishMask');if(m)m.remove();stopConfetti()}

let confRAF=null;
function launchConfetti(){
  let c=document.getElementById('confetti');
  if(!c){c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c)}
  c.width=innerWidth;c.height=innerHeight;
  const ctx=c.getContext('2d');
  const colors=['#ff6b6b','#ffa94d','#20c997','#4dabf7','#9775fa','#f783ac','#ffd43b'];
  const parts=[];
  for(let i=0;i<160;i++){
    parts.push({
      x:innerWidth/2+(Math.random()-.5)*innerWidth*.5,
      y:innerHeight*.35,
      vx:(Math.random()-.5)*11,
      vy:Math.random()*-11-3,
      g:.32+Math.random()*.12,
      size:6+Math.random()*8,
      rot:Math.random()*Math.PI,
      vr:(Math.random()-.5)*.3,
      color:colors[i%colors.length],
      shape:Math.random()<.3?'rect':'circ'
    });
  }
  const start=Date.now();
  (function frame(){
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of parts){
      p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;
      if(p.shape==='rect')ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,7);ctx.fill()}
      ctx.restore();
    }
    if(Date.now()-start<3200){confRAF=requestAnimationFrame(frame)}
    else{ctx.clearRect(0,0,c.width,c.height)}
  })();
}
function stopConfetti(){if(confRAF)cancelAnimationFrame(confRAF);
  const c=document.getElementById('confetti');if(c)c.remove()}

route();
</script>
